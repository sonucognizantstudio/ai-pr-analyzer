version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pranalyzer-postgres
    environment:
      POSTGRES_DB: pranalyzer
      POSTGRES_USER: pranalyzer
      POSTGRES_PASSWORD: pranalyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pranalyzer" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pranalyzer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
